const MISSIONS = [
  {
    id: 'thirds',
    goal: 'Climb to the 12th fret in thirds',
    why: 'Thirds break the habit of playing scales as straight lines, and they are the raw material of every arpeggio.',
    tags: ['intervals', 'full neck'],
    build(root, scale) {
      const iv = SCALES[scale].iv, base = 40 + ((root - 4) % 12 + 12) % 12;
      const deg = [];
      for (let o = 0; o < 3; o++) for (const i of iv) deg.push(base + o * 12 + i);
      const seq = [];
      for (let i = 0; i + 2 < deg.length && deg[i] <= base + 24; i++) { seq.push(deg[i], deg[i + 2]); }
      return { pitches: seq.filter(m => m <= OPEN[5] + FRETS), profile: 'effort', opts: {} };
    },
    check: st => ({ ok: st.highFret >= 12, msg: st.highFret >= 12 ? 'Reached fret ' + st.highFret : 'Only got to fret ' + st.highFret })
  },
  {
    id: 'twofret',
    goal: 'Never move your hand more than two frets',
    why: 'Forces you to reach for notes you would normally shift to, which is how you learn where a position really ends.',
    tags: ['no shifting'],
    build(root, scale, startFret) {
      return { pitches: scaleRun(root, scale, 2, startFret, 'updown'), profile: 'anchor',
               opts: { startNear: startFret, minFret: Math.max(1, startFret), maxFret: startFret + 5, noOpen: true } };
    },
    check: st => ({ ok: st.shifts === 0 && st.span <= 5, msg: st.shifts === 0 ? 'Zero shifts, ' + st.span + '-fret span' : st.shifts + ' shifts crept in' })
  },
  {
    id: 'onestring',
    goal: 'Two octaves on a single string',
    why: 'The neck is six overlapping one-string instruments. Playing lengthwise makes intervals visible as distance.',
    tags: ['one string', 'legato'],
    build(root, scale, startFret, str) {
      const st = str ?? 2;
      // the run has to begin at a root this string can actually reach
      let base = null;
      for (let f = 0; f <= FRETS && base === null; f++) if (pcAt(st, f) === root) base = midiAt(st, f);
      if (base === null) return { pitches: [], profile: 'linear', opts: {} };
      const iv = SCALES[scale].iv, seq = [];
      for (let o = 0; o < 2; o++) for (const i of iv) seq.push(base + o * 12 + i);
      seq.push(base + 24);
      return { pitches: seq.filter(m => m <= midiAt(st, FRETS)), profile: 'linear', opts: { strings: [st] } };
    },
    check: st => ({ ok: st.crossings === 0, msg: st.crossings === 0 ? 'Stayed on one string the whole way' : st.crossings + ' string changes' })
  },
  {
    id: 'everystring',
    goal: 'Play the root on every single string',
    why: 'Six identical pitches in six places. This is the exercise that makes octave shapes stick.',
    tags: ['octaves', 'all strings'],
    build(root) {
      const seq = [];
      for (let s = 0; s < STRINGS; s++) {
        for (let f = 0; f <= FRETS; f++) if (pcAt(s, f) === root) { seq.push(midiAt(s, f)); break; }
      }
      return { pitches: seq, profile: 'effort', opts: {} };
    },
    check: st => ({ ok: st.notes >= 6, msg: st.notes + ' positions found' })
  },
  {
    id: 'threefret',
    goal: 'Everything inside a three-fret window',
    why: 'A cramped box teaches you which notes are actually adjacent, rather than which ones look adjacent in a diagram.',
    tags: ['3 frets', 'no open strings'],
    build(root, scale, startFret) {
      const pcs = scalePcs(root, scale), lo = Math.max(1, startFret), hi = lo + 2;
      const notes = [];
      for (let s = 0; s < STRINGS; s++) for (let f = lo; f <= hi; f++)
        if (pcs.includes(pcAt(s, f))) notes.push(midiAt(s, f));
      notes.sort((a, b) => a - b);
      return { pitches: [...new Set(notes)], profile: 'effort', opts: { minFret: lo, maxFret: hi, noOpen: true } };
    },
    check: st => ({ ok: st.span <= 2, msg: st.span <= 2 ? 'Held a ' + (st.span + 1) + '-fret window' : 'Window grew to ' + (st.span + 1) + ' frets' })
  },
  {
    id: 'noindex',
    goal: 'Play it without your index finger',
    why: 'Your index does most of the work by default. Removing it reveals how weak the other three have quietly stayed.',
    tags: ['fingers 2·3·4'],
    build(root, scale, startFret) {
      const lo = Math.max(2, startFret + 1);
      return { pitches: scaleRun(root, scale, 2, lo, 'up'), profile: 'anchor',
               opts: { minFret: lo, maxFret: lo + 3, noOpen: true, startNear: lo } };
    },
    check: st => ({ ok: st.opens === 0 && st.span <= 3, msg: st.span <= 3 ? 'Three fingers covered a ' + (st.span + 1) + '-fret span' : 'Needed ' + (st.span + 1) + ' frets' })
  },
  {
    id: 'skips',
    goal: 'Arpeggio using only string skips',
    why: 'Skipping strings breaks the sweeping motion and forces the picking hand to aim rather than drift.',
    tags: ['string skipping', 'arpeggio'],
    build(root, scale) {
      const iv = SCALES[scale].iv;
      const tri = [iv[0], iv[2] ?? 4, iv[4] ?? 7, iv[6] ?? 11].filter(x => x !== undefined);
      const base = 40 + ((root - 4) % 12 + 12) % 12;
      const seq = [];
      for (let o = 0; o < 2; o++) for (const i of tri) seq.push(base + o * 12 + i);
      return { pitches: seq.filter(m => m <= OPEN[5] + FRETS), profile: 'effort', opts: { strings: [0, 2, 4] } };
    },
    check: st => ({ ok: st.skips >= 1, msg: st.skips + ' string skips in the route' })
  },
  {
    id: 'descend',
    goal: 'Descend two octaves in fourths',
    why: 'Fourths are how the guitar is tuned, so this run lays flat under the hand once you find the shape.',
    tags: ['intervals', 'descending'],
    build(root, scale) {
      const iv = SCALES[scale].iv, base = 40 + ((root - 4) % 12 + 12) % 12;
      const deg = [];
      for (let o = 0; o < 3; o++) for (const i of iv) deg.push(base + o * 12 + i);
      const seq = [];
      for (let i = deg.length - 1; i - 3 >= 0; i--) { seq.push(deg[i], deg[i - 3]); }
      return { pitches: seq.filter(m => m <= OPEN[5] + FRETS && m >= 40), profile: 'effort', opts: {} };
    },
    check: st => ({ ok: st.notes >= 8, msg: st.notes + ' notes, ' + st.travel + ' frets of travel' })
  },
];

    $('mDone').onclick = () => {
      Progress.missions.add(m.id);
      Progress.markMany(solution.path);
      Progress.save(); render();
    };
  }
}

function fogMap() {
  const W = 560, H = 98, pad = 14;
  const cw = (W - pad * 2) / (FRETS + 1), rh = (H - pad - 8) / STRINGS;
  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="${SVGNS}" style="width:100%;height:auto">`;
  for (let st = 0; st < STRINGS; st++) for (let f = 0; f <= FRETS; f++) {
    const on = Progress.has(st, f);
    s += `<rect x="${pad + f * cw + 1}" y="${rowOf(st) * rh + 2}" width="${cw - 2}" height="${rh - 3}" rx="1.5"
      fill="${on ? 'var(--signal)' : 'var(--line-soft)'}" opacity="${on ? .78 : 1}"/>`;
  }
  for (const f of [0, 3, 5, 7, 9, 12, 15])
    s += `<text x="${pad + f * cw + cw / 2}" y="${H - 3}" text-anchor="middle" fill="var(--muted-2)" font-family="var(--mono)" font-size="8.5">${f}</text>`;
  s += `</svg>`;
  return s;
}

/* =========================================================================
   ROUTER + GLOBAL WIRING
   ========================================================================= */
function render() {
  Player.stop();
  Player.onStep = null;
  View.onTap = null;
  if (S.mode === 'explore') renderExplore();
  else if (S.mode === 'navigate') renderNavigate();
  else if (S.mode === 'chords') renderChords();
  else renderMissions();
}

document.querySelectorAll('.mode-btn').forEach(b => b.onclick = () => {
  document.querySelectorAll('.mode-btn').forEach(o => {
    o.classList.toggle('is-active', o === b);
    o.setAttribute('aria-selected', o === b ? 'true' : 'false');
  });
  S.mode = b.dataset.mode;
  render();
});

$('playBtn').onclick = () => { Audio_.init(); Player.play(S.tempo); };
$('stepBtn').onclick = () => { Audio_.init(); Player.stop(); Player.step(); };
$('tempo').oninput = e => {
  S.tempo = +e.target.value;
  $('tempoVal').textContent = S.tempo + ' BPM';
  if (Player.playing) { Player.stop(); Player.play(S.tempo); }
};
$('soundBtn').onclick = () => {
  Audio_.on = !Audio_.on;
  $('soundBtn').setAttribute('aria-pressed', String(Audio_.on));
  $('soundBtn').innerHTML = `<span class="dot"></span>Sound ${Audio_.on ? 'on' : 'off'}`;
  if (!Audio_.on) Player.stop();
};

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); Audio_.init(); Player.play(S.tempo); }
  if (e.key === 'ArrowRight') { e.preventDefault(); Player.stop(); Player.step(); }
});

Progress.load().then(render);

</script>
</body>
</html>
